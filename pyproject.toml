[project]
name = "rossmann-sales"
version = "0.1.0"
description = "Reproducible Rossmann Store Sales competition project"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "joblib==1.4.2",
    "lightgbm==4.5.0",
    "matplotlib==3.9.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "seaborn==0.13.2",
    "jupyterlab==4.3.1",
    "ipykernel==6.29.5",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
